<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table AI-OCR Tool</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; background-color: #f3f4f6; margin: 0; height: 100vh; overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        /** @jsx React.createElement */
        /** @jsxFrag React.Fragment */

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const { useState, useEffect, useRef, useCallback } = React;

        // 【重要】APIキーを入力してください
        const apiKey = ""; 

        const callGeminiAPI = async (prompt, imageBase64, schema) => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`;
            const imagePart = { inlineData: { mimeType: "image/png", data: imageBase64.split(',')[1] } };
            
            const payload = {
                contents: [{ role: "user", parts: [{ text: prompt }, imagePart] }],
                generationConfig: {
                    temperature: 0.0, // 表の抽出は決定論的に行うため0に設定
                    responseMimeType: "application/json",
                    responseSchema: schema
                }
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || `API Error: ${response.status}`);
            }
            
            const data = await response.json();
            if (!data.candidates || data.candidates.length === 0) throw new Error("結果が返却されませんでした。");
            
            return JSON.parse(data.candidates[0].content.parts[0].text);
        };

        const Icon = ({ name, className }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current) {
                    ref.current.innerHTML = `<i data-lucide="${name}" class="${className || ''}"></i>`;
                    lucide.createIcons({ root: ref.current });
                }
            }, [name, className]);
            return <span ref={ref} className="contents"></span>;
        };

        const App = () => {
            const [pdfDoc, setPdfDoc] = useState(null);
            const [numPages, setNumPages] = useState(0);
            const [previewImages, setPreviewImages] = useState([]);
            
            // 抽出する列名の定義リスト（初期値）
            const [columns, setColumns] = useState(["日付", "品名", "数量", "金額"]);
            const [ocrResults, setOcrResults] = useState(null);
            
            const [isLoading, setIsLoading] = useState(false);
            const [loadingText, setLoadingText] = useState("");
            const [logs, setLogs] = useState([]);

            const addLog = useCallback((msg, type = 'info') => {
                setLogs(prev => [...prev, { time: new Date().toLocaleTimeString('ja-JP', { hour12: false }), msg, type }]);
            }, []);

            const renderPageToBase64 = async (pdf, pageNum, scale = 2.0) => {
                const page = await pdf.getPage(pageNum);
                const viewport = page.getViewport({ scale });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await page.render({ canvasContext: ctx, viewport }).promise;
                return canvas.toDataURL('image/png');
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file || file.type !== 'application/pdf') return;
                
                setIsLoading(true);
                setLoadingText("PDFを読み込んでいます...");
                setOcrResults(null);
                setLogs([]);
                addLog(`PDF「${file.name}」の読み込み開始`);

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(new Uint8Array(arrayBuffer)).promise;
                    setPdfDoc(pdf);
                    setNumPages(pdf.numPages);
                    addLog(`全 ${pdf.numPages} ページを認識しました。`);
                    
                    // プレビュー用に全ページの画像を生成
                    setLoadingText("プレビュー画像を生成中...");
                    const imgs = [];
                    for (let i = 1; i <= pdf.numPages; i++) {
                        imgs.push(await renderPageToBase64(pdf, i, 1.0)); // プレビューは軽量化のためscale=1
                    }
                    setPreviewImages(imgs);
                    addLog("読み込み完了", "success");
                } catch (error) {
                    console.error(error);
                    addLog(`読み込みエラー: ${error.message}`, "error");
                } finally {
                    setIsLoading(false);
                }
            };

            const handleAddColumn = () => setColumns([...columns, "新規列"]);
            const handleUpdateColumn = (index, value) => {
                const newCols = [...columns];
                newCols[index] = value;
                setColumns(newCols);
            };
            const handleRemoveColumn = (index) => {
                setColumns(columns.filter((_, i) => i !== index));
            };

            const handleRunTableOCR = async () => {
                if (!pdfDoc) return;
                if (!apiKey) {
                    alert("コード内の apiKey を設定してください。");
                    return;
                }
                if (columns.length === 0) {
                    alert("抽出する列を1つ以上指定してください。");
                    return;
                }

                setIsLoading(true);
                setOcrResults([]);
                let allResults = [];
                let hasError = false;

                // Geminiに要求するJSONスキーマの動的生成
                const propertiesSchema = {};
                columns.forEach(col => {
                    propertiesSchema[col] = { type: "STRING" };
                });

                const schema = {
                    type: "ARRAY",
                    description: "抽出した表の各行のデータ配列",
                    items: {
                        type: "OBJECT",
                        properties: propertiesSchema,
                        required: columns // 欠損項目も空文字として必ずキーを含める
                    }
                };

                const prompt = `画像内の「最大の表（リスト・明細）」の構造を認識し、行ごとにデータを抽出してください。
以下の指定した列名に該当するデータを正確に取得し、JSON配列で返してください。
データが存在しない、または空欄のセルは空文字 "" を設定してください。
改行が含まれるセルはそのまま改行(\\n)を保持してください。

抽出対象の列:
${columns.map(c => `- ${c}`).join('\n')}
`;

                try {
                    for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                        addLog(`[P.${pageNum}/${numPages}] 表データの抽出を開始...`);
                        setLoadingText(`ページ ${pageNum}/${numPages} を解析中...`);
                        
                        // 解析用は解像度を高め(scale=2.0)に生成
                        const base64Img = await renderPageToBase64(pdfDoc, pageNum, 2.0);
                        
                        try {
                            const pageData = await callGeminiAPI(prompt, base64Img, schema);
                            
                            // ページ番号を付与して保存
                            const rowsWithPage = pageData.map(row => ({
                                _page: pageNum,
                                ...row
                            }));
                            
                            allResults = [...allResults, ...rowsWithPage];
                            setOcrResults([...allResults]); // 画面をプログレッシブに更新
                            addLog(`[P.${pageNum}] から ${pageData.length} 行のデータを抽出しました。`, "success");
                            
                        } catch (pageErr) {
                            console.error(`Page ${pageNum} error:`, pageErr);
                            addLog(`[P.${pageNum}] の解析でエラーが発生しました: ${pageErr.message}`, "error");
                            hasError = true;
                        }

                        // APIのレート制限対策（連続リクエスト時の待機）
                        if (pageNum < numPages) {
                            await new Promise(res => setTimeout(res, 3000));
                        }
                    }

                    if (hasError) {
                        addLog("処理は完了しましたが、一部のページでエラーが発生しました。", "warning");
                    } else {
                        addLog(`全ページの解析が完了しました。合計 ${allResults.length} 行抽出。`, "success");
                    }
                } catch (err) {
                    console.error(err);
                    addLog(`致命的なエラー: ${err.message}`, "error");
                } finally {
                    setIsLoading(false);
                }
            };

            const handleExport = (format) => {
                if (!ocrResults || ocrResults.length === 0) return;

                const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                const separator = format === 'csv' ? ',' : '\t';
                
                const escapeCsv = (str) => {
                    if (str === null || str === undefined) return '""';
                    const s = String(str);
                    return `"${s.replace(/"/g, '""')}"`;
                };

                // ヘッダー行作成
                const headerRow = ["ページ", ...columns].map(escapeCsv).join(separator);
